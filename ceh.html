<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* в приложении «Цех» страница раскладывается сразу на 1920 точек, приставка масштабирует её сама */
if (window.RazApp) document.querySelector('meta[name=viewport]').setAttribute('content', 'width=1920, initial-scale=' + (screen.width ? Math.min(1, screen.width / 1920) : 0.5));</script>
<title>Разгуляев — экран цеха</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Экран для цеха: светлая тема CRM (iOS). Для слабой приставки: без размытия, теней и постоянных анимаций —
   страница перерисовывается только когда пришли новые данные, и раз в минуту — часы. */
:root{--bg:#e9e9ee;--card:#fff;--ink:#1d1d1f;--sub:#3a3a3c;--mute:#8e8e93;--line:#e5e5ea;--blue:#007aff;--teal:#30b0c7;--purple:#af52de;--orange:#ff9500;--green:#34c759;--red:#ff3b30;--pink:#ff2d55;--kaspi:#f14635;--T:"Inter Tight",Inter,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.card{background:var(--card);border-radius:30px;padding:26px 30px;overflow:hidden;position:absolute}
.h{display:flex;align-items:baseline;font:700 32px var(--T);margin-bottom:8px;white-space:nowrap}
.h .n{margin-left:auto;padding-left:12px;font:500 23px Inter;color:var(--mute)}
/* шапка */
.top{position:absolute;left:48px;right:48px;top:22px;height:120px;display:flex;align-items:center}
#logo{height:104px;width:104px;display:block;flex:none}
.vline{width:2px;height:84px;background:#d1d1d6;margin:0 30px 0 34px;flex:none}
.dt small{display:block;font:500 22px Inter;color:var(--mute)}.dt b{display:block;font:700 44px var(--T);letter-spacing:-.5px;line-height:1.1;white-space:nowrap}
.sp{flex:1}
.mus{display:flex;align-items:center;background:var(--card);border-radius:22px;padding:12px 26px 12px 12px;max-width:460px;min-width:0}
.cov{width:72px;height:72px;border-radius:14px;flex:none;background:linear-gradient(135deg,#ff2d55,#af52de 55%,#007aff);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-right:18px}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.mus small{display:block;font:500 19px Inter;color:var(--mute)}.mus b{display:block;font:600 25px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mus .mt{min-width:0}
#clock{font:700 106px var(--T);letter-spacing:-2px;line-height:1;margin-right:26px}
.mid{position:absolute;left:50%;top:0;height:120px;transform:translateX(-50%);display:flex;align-items:center;white-space:nowrap}
/* пилюли этапов */
.pill{display:inline-block;font:600 21px Inter;padding:6px 14px;border-radius:99px;white-space:nowrap;flex:none}
.p-new{background:#e5f0ff;color:var(--blue)}.p-agree{background:#e3f6f9;color:#1b8ca1}.p-design{background:#f6eafc;color:#9440c2}.p-prod{background:#fff2df;color:#c96f00}.p-ready{background:#e8f8ed;color:#1f9d45}.p-done{background:#f2f2f7;color:#8e8e93}
/* ведомость */
.ord{display:flex;align-items:center;padding:15px 0;border-top:1px solid var(--line)}
.ord.first{border-top:0}
.ord .tm{width:104px;flex:none;text-align:center;font:700 34px var(--T);color:var(--c);margin-right:22px}
.ord .tm small{display:block;font:500 18px Inter;color:var(--mute);margin-top:2px}
.ord .mn{flex:1;min-width:0}
.ord .nm{font:600 28px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ord .nm span{color:var(--mute);font-weight:500}
.ord .w{font:500 23px Inter;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font:500 21px Inter;color:var(--mute)}
.qty .l{display:flex;align-items:center;white-space:nowrap;min-width:0;overflow:hidden;flex:1}
.qty .l>span:last-child{overflow:hidden;text-overflow:ellipsis}
.qty .pill,.ord>.pill{font-size:19px;padding:5px 12px;margin-left:10px;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.qty .b{width:56px;height:8px;border-radius:9px;background:#ececf0;overflow:hidden;margin-right:12px;flex:none}.qty .b i{display:block;height:100%;background:var(--c);border-radius:9px}
.qty em{font-style:normal;color:var(--ink);font-weight:600}
.ord.old .tm{color:var(--mute);font-size:24px}.ord.old .nm,.ord.old .w{color:#aeaeb2}.ord.old .pill{opacity:.6}
.sep{font:600 19px Inter;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;padding:16px 0 6px;border-top:1px solid var(--line)}
.empty{font:500 24px Inter;color:var(--mute);padding:18px 0}
/* задачи */
.task{display:flex;align-items:flex-start;padding:15px 0;border-top:1px solid var(--line);font:500 26px Inter;line-height:1.28}
.task.first{border-top:0}
.chk{width:38px;height:38px;border-radius:50%;border:3px solid #c7c7cc;flex:none;display:flex;align-items:center;justify-content:center;margin-right:16px}
.task .tt{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.task small{display:block;font:500 19px Inter;color:var(--mute);margin-top:3px}
.task.done .tx{color:var(--mute);text-decoration:line-through}.task.done .chk{background:var(--green);border-color:var(--green)}
.task.late .chk{border-color:var(--red)}.task.late small{color:var(--red)}
/* Kaspi */
.kh{display:flex;align-items:center;font:700 32px var(--T);margin-bottom:8px;white-space:nowrap}
.kl{width:40px;height:40px;border-radius:11px;background:var(--kaspi);color:#fff;font:700 25px var(--T);display:flex;align-items:center;justify-content:center;margin-right:12px}
.kh .n{margin-left:auto;font:500 22px Inter;color:var(--mute)}
.ksub{font:500 20px Inter;color:var(--mute);margin:-2px 0 6px}
.k{display:flex;align-items:center;padding:12px 0;border-top:1px solid var(--line);font:500 24px Inter}
.k.first{border-top:0}
.k .tg{font:600 19px Inter;padding:5px 10px;border-radius:10px;flex:none;width:96px;text-align:center;margin-right:16px}
.tg.as{background:#fff2df;color:#c96f00}.tg.gv{background:#e5f0ff;color:var(--blue)}
.k .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.k .x small{display:block;font:500 18px Inter;color:var(--mute)}
.k .x.two{white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.k .r{flex:none;text-align:right;font:600 24px Inter;white-space:nowrap;margin-left:14px}
.k .d{width:92px;flex:none;font:600 22px Inter;color:var(--blue)}
/* принтеры */
#eq{left:48px;right:48px;top:876px;bottom:40px;padding:14px 34px;display:flex;align-items:center;background:#00ae42;color:#fff}
#eq .empty{color:rgba(255,255,255,.85)}
.pr{flex:1;display:flex;align-items:center;min-width:0}
.pdiv{width:1px;background:rgba(255,255,255,.35);align-self:stretch;margin:0 26px;flex:none}
.ring{position:relative;width:76px;height:76px;flex:none;margin-right:16px}.ring svg{transform:rotate(-90deg);display:block}
.ring span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font:600 19px Inter}
.pr .pn{font:600 26px Inter;white-space:nowrap}.pr .pw{font:500 20px Inter;color:rgba(255,255,255,.8);margin-top:2px;white-space:nowrap}
.pr .end{margin-left:auto;text-align:center;font:700 38px var(--T);line-height:1;white-space:nowrap;background:#fff;color:#00ae42;border-radius:18px;padding:9px 16px 8px}
.pr .end small{display:block;font:600 17px Inter;color:#00ae42;margin-top:3px}
.pr .off{margin-left:auto;padding-left:10px;font:500 24px Inter;color:rgba(255,255,255,.8);white-space:nowrap}
.pr .bad{margin-left:auto;font:600 22px Inter;color:var(--red);background:#fff;padding:6px 14px;border-radius:99px;white-space:nowrap}
/* WhatsApp: неотвеченные клиенты (данные Ани) */
.wh{display:flex;align-items:center;font:700 32px var(--T);margin-bottom:6px;white-space:nowrap}
.wl{width:40px;height:40px;border-radius:11px;background:#25d366;display:flex;align-items:center;justify-content:center;margin-right:12px;flex:none}
.wbig{display:flex;align-items:baseline;margin:2px 0 6px}.wbig b{font:700 64px var(--T);line-height:1;margin-right:14px}.wbig span{font:500 24px Inter;color:var(--sub)}
.wbig.ok b{color:var(--green)}.wbig.bad b{color:var(--red)}
.wr{display:flex;align-items:center;padding:9px 0;border-top:1px solid var(--line);font:500 23px Inter}
.wr .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wr .r{flex:none;margin-left:12px;color:var(--mute);font-size:20px}.wr .r.late{color:var(--red)}
/* выбор пультом и мышью */
.ord,.task{cursor:pointer;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:18px}
.ord.foc,.task.foc{background:#eaf3ff;box-shadow:0 0 0 4px var(--blue);border-top-color:transparent}
.ord.foc+.ord,.task.foc+.task,.ord.foc+.sep{border-top-color:transparent}
.mus{cursor:pointer}.mus.foc{box-shadow:0 0 0 4px var(--blue)}
.mus .tip{display:none;font:500 18px Inter;color:var(--blue)}.mus.foc .tip{display:block}
.task.wait .chk{border-color:var(--blue);border-style:dashed}
body.nocur,body.nocur *{cursor:none!important}
/* окно заказа */
#dlg{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:5}
#dlg.on{display:flex}
#dlg .box{background:#fff;border-radius:36px;width:1360px;max-height:960px;padding:38px 46px 30px;display:flex;flex-direction:column;position:relative}
#dlg .x0{position:absolute;right:28px;top:26px;width:56px;height:56px;border-radius:50%;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font:500 34px Inter;color:var(--sub);cursor:pointer;line-height:1}
#dlg .x0.foc{box-shadow:0 0 0 4px var(--blue);background:#eaf3ff;color:var(--blue)}
#dlg h2{font:700 44px var(--T);margin-right:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#dlg h2 span{color:var(--mute);font-weight:600}
#dlg .sv{display:flex;align-items:center;margin-top:10px;font:500 24px Inter;color:var(--sub)}#dlg .sv .pill{margin-right:14px}
.info{display:flex;margin:24px 0 8px;background:#f5f5f7;border-radius:24px;padding:18px 8px}
.info div{flex:1;padding:0 22px;border-left:1px solid #e1e1e6}.info div:first-child{border-left:0}
.info small{display:block;font:500 19px Inter;color:var(--mute)}.info b{display:block;font:600 30px Inter;margin-top:4px;white-space:nowrap}
.info .red{color:var(--red)}.info .grn{color:var(--green)}
.dsc{font:500 22px Inter;color:var(--sub);margin:12px 4px 4px;line-height:1.35;max-height:90px;overflow:hidden}
.its{margin-top:8px;overflow:hidden;flex:1;min-height:0;padding:6px}
.it{display:flex;align-items:center;padding:12px 14px;border-radius:18px;border-top:1px solid var(--line)}
.it:first-child{border-top-color:transparent}
.it.foc{background:#eaf3ff;box-shadow:0 0 0 4px var(--blue);border-top-color:transparent}.it.foc+.it{border-top-color:transparent}
.it .nm{flex:1;min-width:0;font:500 27px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .qn{flex:none;font:500 24px Inter;color:var(--mute);margin:0 22px;white-space:nowrap}
.it .ctl{flex:none;display:flex;align-items:center}
.it .bt{width:52px;height:52px;border-radius:50%;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font:500 34px Inter;color:var(--ink);cursor:pointer;line-height:1}
.it .val{width:110px;text-align:center;font:600 32px Inter;border:0;background:transparent;color:var(--ink);outline:none;-moz-appearance:textfield}
.it .val::-webkit-outer-spin-button,.it .val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.it .of{font:500 22px Inter;color:var(--mute);width:120px;margin-left:6px;white-space:nowrap}
.it .all{font:600 20px Inter;color:var(--blue);background:#e5f0ff;border-radius:99px;padding:8px 16px;margin-left:8px;cursor:pointer;white-space:nowrap}
.it .all.full{color:var(--green);background:#e8f8ed}
.it .pb{width:120px;height:8px;border-radius:9px;background:#ececf0;overflow:hidden;margin-left:18px;flex:none}.it .pb i{display:block;height:100%;background:var(--green);border-radius:9px}
.it .sv2{font:500 18px Inter;color:var(--blue);width:110px;margin-left:10px;text-align:right;flex:none}
.hint{margin-top:18px;font:500 20px Inter;color:var(--mute);text-align:center}
#toast{position:absolute;left:50%;bottom:220px;transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;font:500 26px Inter;padding:16px 28px;border-radius:22px;display:none;z-index:9;white-space:nowrap}
/* подключение по QR */
#pair{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:var(--bg)}
#pair .in{display:flex;align-items:center;background:#fff;border-radius:40px;padding:56px 64px}
#pair .q{width:420px;height:420px;margin-right:60px;flex:none}#pair .q svg{width:100%;height:100%;display:block}
#pair h1{font:700 52px var(--T);margin-bottom:22px}#pair p{font:500 30px Inter;color:var(--sub);line-height:1.4;max-width:720px}
#pair ol{font:500 30px Inter;color:var(--sub);line-height:1.5;margin:18px 0 0 36px}
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <svg id="logo" viewBox="1.5 2.6 8.2 8.2" aria-label="Разгуляев"><path id="logo-p" fill="#1d1d1f" fill-rule="evenodd" d=""/></svg>
    <div class="mid"><div id="clock"></div><div class="dt"><small id="upd">Сегодня в цехе</small><b id="date"></b></div></div>
    <div class="sp"></div>
    <div class="mus" id="mus"><div class="cov" id="cov"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M9 18V5l12-2v13" stroke="#fff" stroke-width="2" fill="none"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><div class="mt"><small id="mus-s">Играет в цехе</small><b id="track">Включаю волну…</b><span class="tip">ОК — пауза · ← → — трек</span></div></div>
  </div>
  <div class="card" id="ord" style="left:48px;top:162px;width:592px;height:690px"></div>
  <div class="card" id="tsk" style="left:664px;top:162px;width:592px;height:690px"></div>
  <div class="card" id="ksp" style="left:1280px;top:162px;right:48px;height:333px"></div>
  <div class="card" id="wa" style="left:1280px;top:519px;right:48px;height:333px"></div>
  <div class="card" id="eq"></div>
  <div id="dlg"><div class="box" id="dlg-b"></div></div>
  <div id="toast"></div>
  <div id="pair"><div class="in"><div class="q" id="qr"></div><div><h1>Подключите экран цеха</h1><p>Наведите камеру телефона, на котором открыт учёт студии, на этот QR-код и откройте ссылку.</p><ol><li>Телефон откроет учёт.</li><li>Через пару секунд здесь появятся заказы и задачи.</li></ol></div></div></div>
</div>

<script src="tv-core.js?v=202611211900"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var DB = (window.FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL || '').replace(/\/$/, '');
var CRM = 'https://razgulyaevevgeny.github.io/raz-studio-crm/';
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var pad = function(n){ return (n < 10 ? '0' : '') + n; };
var ds = function(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var DAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
var log = function(t){ try { if (window.RazApp && RazApp.log) RazApp.log(String(t)); } catch (e) {} };
var store = { get: function(k){ try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: function(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} } };

/* ---------- масштаб в обычном браузере (в приложении страница уже 1920 точек) ---------- */
/* окно шире 16:9 — сцена растягивается вширь (колонки шире), чтобы справа не было пустой полосы */
function fit(){ var W = Math.max(1920, Math.min(2880, Math.round(1080 * innerWidth / Math.max(1, innerHeight)))), s = Math.min(innerWidth / W, innerHeight / 1080), st = $('stage');
  st.style.width = W + 'px'; var cw = Math.floor((W - 96 - 48) / 3);
  $('ord').style.width = cw + 'px'; $('tsk').style.left = (48 + cw + 24) + 'px'; $('tsk').style.width = cw + 'px'; $('ksp').style.left = $('wa').style.left = (48 + 2 * (cw + 24)) + 'px';
  st.style.transform = 'scale(' + s + ')'; st.style.left = Math.max(0, (innerWidth - W * s) / 2) + 'px'; st.style.top = Math.max(0, (innerHeight - 1080 * s) / 2) + 'px';
  try { if (S && S.d) render(true); } catch (e) {} }
if (!window.RazApp) { addEventListener('resize', fit); fit(); }
/* на телевизоре края картинки обрезаются (overscan) — в приложении отодвигаем всё от рамки на 4 % с каждой стороны */
else (function(){ var m = Math.max(0, Math.min(10, +(store.get('ceh.margin') || 4))), k = 1 - m / 50, st = $('stage');
  st.style.transform = 'scale(' + k + ')'; st.style.left = (1920 * m / 100) + 'px'; st.style.top = (1080 * m / 100) + 'px'; })();

/* ---------- логотип как на бирке (контуры из label-logo.json, в мм) ---------- */
fetch('label-logo.json').then(function(r){ return r.json(); }).then(function(L){
  var d = L.filter(function(p){ var mx = 0; for (var i = 0; i < p.length; i += 2) if (p[i] > mx) mx = p[i]; return mx < 10; }).map(function(p){ var s = 'M' + p[0] + ',' + p[1]; for (var i = 2; i < p.length; i += 2) s += 'L' + p[i] + ',' + p[i + 1]; return s + 'Z'; }).join('');
  $('logo-p').setAttribute('d', d);
}).catch(function(){});

/* ---------- ключ экрана: из ссылки (#k=…) или сохранённый после подключения по QR ---------- */
var hk = (location.hash.match(/k=([A-Za-z0-9]{24,64})/) || [])[1];
if (/reset/.test(location.hash)) store.set('ceh.key', '');
if (hk) store.set('ceh.key', hk);
var KEY = store.get('ceh.key');

var S = { d: null, music: null, now: null, q: null }, W = null, lastJ = '';
var ORD = {}, PEND = {}, MADE = {}, DLG = null;

/* ---------- часы и дата ---------- */
function today(){ return ds(new Date()); }
function dayShift(n){ var d = new Date(); d.setDate(d.getDate() + n); return ds(d); }
function clock(){ var n = new Date(); $('clock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
  $('date').textContent = DAYS[n.getDay()] + ', ' + n.getDate() + ' ' + MON[n.getMonth()]; }
function tickClock(){ clock(); var n = new Date(); setTimeout(function(){ tickClock(); render(true); }, (60 - n.getSeconds()) * 1000 + 50); }

/* ---------- отрисовка ---------- */
var ST = { 'new':['Новый','new','blue'], agree:['согласование','agree','teal'], design:['разработка','design','purple'], prod:['производство','prod','orange'], ready:['готов','ready','green'], done:['выдан','done','mute'] };
function dayParts(d){ if (!d) return ['—','без срока'];
  var t = today(), p = d.split('-'); var dd = +p[2], mm = +p[1] - 1;

  else if (n === 'del') { typed = String(curMade(+k)).slice(0, -1); typedT = Date.now(); setMade(+k, +typed || 0); }
  return true;
}
$('dlg').addEventListener('click', function(e){

});

/* ---------- выбор пультом (стрелки, ОК) и с клавиатуры ---------- */
var FOC = { z: 'ord', i: 0, on: false }, focT = 0, ups = 0, upAt = 0;
function zoneEls(z){ return z === 'ord' ? $('ord').querySelectorAll('.ord[data-i]') : z === 'tsk' ? $('tsk').querySelectorAll('.task[data-t]') : [$('mus')]; }
function focApply(){
  var all = document.querySelectorAll('#stage > .top .foc, #ord .foc, #tsk .foc'); for (var i = 0; i < all.length; i++) all[i].classList.remove('foc');
  if (!FOC.on || DLG) return; var L = zoneEls(FOC.z);
  if (!L.length && FOC.z !== 'mus') { FOC.z = FOC.z === 'ord' ? 'tsk' : 'ord'; L = zoneEls(FOC.z); if (!L.length) { FOC.z = 'mus'; L = zoneEls('mus'); } }
  if (FOC.i >= L.length) FOC.i = L.length - 1; if (FOC.i < 0) FOC.i = 0; if (L[FOC.i]) L[FOC.i].classList.add('foc'); }
function focShow(){ FOC.on = true; clearTimeout(focT); focT = setTimeout(function(){ FOC.on = false; focApply(); }, 40000); focApply(); }
function musCmd(d){ if (window.RazApp && RazApp.musicCmd) { try { RazApp.musicCmd(d); } catch (e) {} } else wpCmd({ do: d }); }
window.razPaused = function(p){ toast(p ? 'Музыка на паузе' : 'Музыка играет'); };
window.cehKey = function(n, rep){
  rep = +rep || 0;
  if (DLG) return dlgKey(n, rep);
  if (n === 'back') { if (FOC.on) { FOC.on = false; focApply(); return true; } return false; }
  if (!FOC.on) { focShow(); return true; }   /* первое нажатие только показывает рамку */
  focShow(); var L = zoneEls(FOC.z);
  if (n === 'up') { if (FOC.z === 'mus') { var t = Date.now(); ups = t - upAt < 1500 ? ups + 1 : 1; upAt = t; if (ups >= 2 && !rep && window.RazApp && RazApp.update) { ups = 0; RazApp.update(); } }
    else if (FOC.i > 0) FOC.i--; else FOC.z = 'mus'; }
  else if (n === 'down') { if (FOC.z === 'mus') { FOC.z = 'ord'; FOC.i = 0; } else if (FOC.i < L.length - 1) FOC.i++; }
  else if (n === 'left') { if (FOC.z === 'tsk') FOC.z = 'ord'; else if (FOC.z === 'mus') { if (!rep) musCmd('prev'); } }
  else if (n === 'right') { if (FOC.z === 'ord') FOC.z = 'tsk'; else if (FOC.z === 'mus') { if (!rep) musCmd('next'); } }
  else if (n === 'ok' && !rep) { var el = L[FOC.i]; if (FOC.z === 'ord' && el) dlgOpen(el.getAttribute('data-i')); else if (FOC.z === 'tsk' && el) taskToggle(el); else if (FOC.z === 'mus') { if (WP.blocked) wpResume(); else musCmd('toggle'); } }
  focApply(); return true;
};
var KMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', Escape: 'back', Backspace: 'del', Up: 'up', Down: 'down', Left: 'left', Right: 'right', Esc: 'back' };
document.addEventListener('keydown', function(e){
  var n = KMAP[e.key] || (e.keyCode === 13 ? 'ok' : e.keyCode === 37 ? 'left' : e.keyCode === 38 ? 'up' : e.keyCode === 39 ? 'right' : e.keyCode === 40 ? 'down' : '');
  var inInput = e.target && e.target.tagName === 'INPUT';
  if (DLG && /^[0-9]$/.test(e.key) && !inInput) { e.preventDefault(); dlgKey('digit', 0, e.key); return; }
  if (inInput && (n === 'del' || n === 'left' || n === 'right' || /^[0-9]$/.test(e.key))) return;   /* печатают в поле — не мешаем */
  if (n === 'del' && !DLG) return;
  if (!n) { if (e.key === ' ' && !DLG) n = 'ok'; else return; }
  e.preventDefault(); window.cehKey(n, e.repeat ? 5 : 0);
});
/* мышь: заказ — окно, задача — галочка, музыка — пауза; курсор прячется через 5 секунд */
document.addEventListener('click', function(e){

  if (o) dlgOpen(o.getAttribute('data-i')); else if (t) taskToggle(t); else if (m) { if (WP.blocked || !WP.a && !window.RazApp) wpResume(); else musCmd('toggle'); }
});
var curT = 0; document.addEventListener('mousemove', function(){ document.body.classList.remove('nocur'); clearTimeout(curT); curT = setTimeout(function(){ document.body.classList.add('nocur'); }, 5000); });

/* ---------- музыка в обычном браузере (тестовый экран): та же «Моя волна» через сервер музыки ----------
   На приставке играет само приложение. В браузере играем здесь, если приставка сейчас не играет. */
var WP = { a: null, q: [], user: [], played: [], cur: null, blocked: false, cmd: null, sig: '', busy: false, last: '' };
function wpApi(p){ return TV.YM.worker + p + (p.indexOf('?') >= 0 ? '&' : '?') + 'k=' + encodeURIComponent(TV.YM.key); }
function wpM(){ return TV.normalizeMusic(S.music); }
function tvPlays(){ var n = S.now; return n && n.src !== 'web' && Date.now() - (+n.at || 0) < 3 * 6e4; }
function wpSync(){
  if (window.RazApp || !TV.YM || !TV.YM.worker || /nomusic/.test(location.hash)) return;
  var m = wpM(), sig = [m.st, m.mood, m.div, m.lang].join('|');
  if (m.cmd && m.cmd.id) { if (WP.cmd === null) WP.cmd = m.cmd.id; else if (m.cmd.id !== WP.cmd) { WP.cmd = m.cmd.id; if (WP.a && Date.now() - (m.cmd.at || 0) < 120000) wpCmd(m.cmd); } }
  else if (WP.cmd === null) WP.cmd = '';
  if (WP.a) { WP.a.volume = Math.max(0, Math.min(1, m.vol / 100)); if (sig !== WP.sig) { WP.sig = sig; WP.q = []; WP.last = ''; wpNext(); } return; }
  if (tvPlays()) { $('mus-s').textContent = 'Играет в цехе'; return; }
  WP.sig = sig; WP.a = new Audio(); WP.a.preload = 'auto';
  WP.a.addEventListener('ended', function(){ wpNext(); });
  WP.a.addEventListener('error', function(){ setTimeout(wpNext, 2000); });
  WP.a.addEventListener('play', wpReport); WP.a.addEventListener('pause', wpReport);
  WP.a.volume = m.vol / 100; wpNext();
  setInterval(function(){ if (WP.cur && !WP.a.paused) wpReport(); }, 30000);
}
function wpFill(cb){ if (WP.busy) return; WP.busy = true; var m = wpM();
  fetch(wpApi('/wave?st=' + encodeURIComponent(m.st) + '&mood=' + m.mood + '&div=' + m.div + '&lang=' + m.lang + (WP.last ? '&last=' + WP.last : ''))).then(function(r){ return r.json(); })
    .then(function(j){ WP.busy = false; var t = (j.tracks || []).filter(function(x){ return x.id; }); if (t.length) { WP.q = WP.q.concat(t); WP.last = t[t.length - 1].id; } if (cb) cb(); })
    .catch(function(){ WP.busy = false; $('track').textContent = 'Нет связи с сервером музыки'; setTimeout(function(){ if (cb) cb(); }, 10000); }); }
function wpNext(){ var t = WP.user.shift() || WP.q.shift(); if (!t) { wpFill(function(){ if (WP.q.length) wpNext(); }); return; }
  if (WP.q.length < 3) wpFill(); if (WP.cur) WP.played.push(WP.cur); if (WP.played.length > 20) WP.played.shift(); wpPlay(t); }
function wpPrev(){ if (WP.a.currentTime > 8 || !WP.played.length) { WP.a.currentTime = 0; WP.a.play().catch(function(){}); return; } if (WP.cur) WP.q.unshift(WP.cur); WP.cur = null; wpPlay(WP.played.pop()); }
function wpPlay(t){ WP.cur = t; fetch(wpApi('/url?id=' + encodeURIComponent(t.id))).then(function(r){ return r.json(); }).then(function(j){
    if (WP.cur !== t) return; if (!j.url) { setTimeout(wpNext, 1500); return; }
    WP.a.src = j.url; var p = WP.a.play(); if (p && p.catch) p.then(function(){ WP.blocked = false; wpReport(); }).catch(function(){ WP.blocked = true; wpReport(); });
  }).catch(function(){ setTimeout(wpNext, 3000); }); }
function wpResume(){ if (!WP.a) { wpSync(); if (!WP.a) return; } WP.a.play().then(function(){ WP.blocked = false; wpReport(); }).catch(function(){}); }
function wpCmd(c){ if (!WP.a) return; var d = c.do;
  if (d === 'toggle') { if (WP.a.paused) wpResume(); else WP.a.pause(); }
  else if (d === 'pause') WP.a.pause(); else if (d === 'play') wpResume();
  else if (d === 'next') wpNext(); else if (d === 'prev') wpPrev();
  else if ((d === 'track' || d === 'queue') && c.t && c.t.id) { if (d === 'track') { if (WP.cur) WP.played.push(WP.cur); wpPlay(c.t); } else { WP.user.push(c.t); wpReport(); } }
  else if (d === 'unqueue') { WP.user = WP.user.filter(function(x){ return x.id !== c.id2; }); wpReport(); } }
function wpReport(){ var t = WP.cur; if (!t) return; var up = WP.user.concat(WP.q).slice(0, 8).map(function(x){ return { id: x.id, title: x.title, artist: x.artist, cover: x.cover || '' }; });
  window.razNow({ id: t.id, title: t.title, artist: t.artist, cover: t.cover || '', ms: +t.durationMs || 0, pos: Math.round((WP.a.currentTime || 0) * 1000), paused: WP.a.paused, vol: wpM().vol, next: up, src: 'web' }); }

/* ---------- музыка: играет само приложение (как в клиентской зоне), страница передаёт настройки ---------- */
var musicJ = '';
function music(){ if (!window.RazApp || !RazApp.music || !TV.YM) return;
  var m = TV.normalizeMusic(S.music), j = JSON.stringify(m); if (j === musicJ) return; musicJ = j;
  try { RazApp.music(JSON.stringify(Object.assign({ worker: TV.YM.worker, key: TV.YM.key }, m))); } catch (e) {} }
var nowT = 0;
window.razNow = function(t){ if (!t) return; S.now = t; drawMusic();
  if (nowT) return; nowT = setTimeout(function(){ nowT = 0; if (!KEY || !DB) return;
    var n = Object.assign({}, S.now, { at: Date.now(), src: S.now.src || null }); delete n.q;   /* PATCH, чтобы не стереть очередь отметок now/q */
    fetch(DB + '/pub/' + KEY + '/now.json', { method: 'PATCH', body: JSON.stringify(n) }).catch(function(){}); }, 2000); };

/* ---------- поток из базы: pub/<ключ> (сводка d, настройки музыки, что играет) ---------- */
function setPath(obj, path, val){ var p = path.split('/').filter(Boolean); if (!p.length) return val; obj = obj || {}; var o = obj;
  for (var i = 0; i < p.length - 1; i++) { if (!o[p[i]] || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; }
  if (val === null) delete o[p[p.length - 1]]; else o[p[p.length - 1]] = val; return obj; }
function stream(path, on){
  var url = DB + '/pub/' + path + '.json', root = null, es = null, poll = 0;
  var apply = function(){ on(root || {}); };
  try { es = new EventSource(url);
    es.addEventListener('put', function(e){ try { var m = JSON.parse(e.data); root = m.path === '/' ? m.data : setPath(root, m.path, m.data); apply(); } catch (x) {} });
    es.addEventListener('patch', function(e){ try { var m = JSON.parse(e.data); for (var k in m.data) root = setPath(root, (m.path === '/' ? '' : m.path) + '/' + k, m.data[k]); apply(); } catch (x) {} });
    es.onerror = function(){ log('поток ' + path.slice(0, 6) + '…: переподключение'); };
  } catch (e) { poll = setInterval(function(){ fetch(url).then(function(r){ return r.json(); }).then(function(x){ root = x; apply(); }).catch(function(){}); }, 60000); }
  return { close: function(){ if (es) es.close(); clearInterval(poll); } };
}
var wStream = null, wKey = '';
function start(){
  $('pair').style.display = 'none';
  stream(KEY, function(r){
    S.d = r.d || null; S.music = r.music || null; S.q = r.now && r.now.q || null; qNote();
    if (r.now && (!S.now || !window.RazApp)) { S.now = r.now; drawMusic(); }
    music(); wpSync(); render(); if (DLG) dlgDraw();
    var wk = S.d && S.d.wk || '';
    if (wk && wk.length >= 24 && wk !== wKey) { wKey = wk; if (wStream) wStream.close(); wStream = stream(wk, function(x){ W = x; render(); }); }
    if (!S.d) $('ord').innerHTML = '<div class="h">Ведомость</div><div class="empty">Ждём данные из учёта: откройте учёт на телефоне, и через пару секунд здесь появятся заказы.</div>';
  });
}
/* подключение: экран показывает QR со ссылкой на учёт и ждёт, пока телефон положит ключ в pub/<код>/k */
function pair(){
  var code = store.get('ceh.pair'); if (!code || code.length < 32) { var c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', a = new Uint8Array(32); (window.crypto || window.msCrypto).getRandomValues(a); code = ''; for (var i = 0; i < 32; i++) code += c[a[i] % c.length]; store.set('ceh.pair', code); }
  $('qr').innerHTML = TV.qr(CRM + '#ceh-pair=' + code);
  $('pair').style.display = 'flex';
  var s = stream(code, function(r){ if (r && r.k && String(r.k).length >= 24) { s.close(); KEY = String(r.k); store.set('ceh.key', KEY); store.set('ceh.pair', ''); log('экран подключён'); start(); } });
}
tickClock();
if (window.RazApp) music();   /* волна включается сразу при запуске, даже до подключения по QR */
if (KEY) start(); else pair();
/* раз в сутки ночью перезагружаем страницу — чтобы подтянуть обновления экрана */
setInterval(function(){ var h = new Date().getHours(); if (h === 4 && Date.now() - (window._t0 || (window._t0 = Date.now())) > 3 * 3600e3) location.reload(); }, 30 * 6e4);
window._t0 = Date.now();
})();
