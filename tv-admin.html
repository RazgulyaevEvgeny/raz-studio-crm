<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран в студии — админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--blue:#007aff;--ink:#1d1d1f;--mute:#8e8e93;--tile:#f2f2f7;--tile2:#e5e5ea;--line:rgba(0,0,0,.07);--red:#ff3b30;--green:#34c759;--T:"Inter Tight",Inter,system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;font-size:15px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;background:var(--tile);font-weight:600;font-family:var(--T);white-space:nowrap}
  .btn:hover{background:var(--tile2)}
  .btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:#0062cc}
  .btn.pri:disabled{opacity:.45;cursor:default}
  .btn svg{width:18px;height:18px}
  .ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
  .ibtn:hover{background:var(--tile2);color:var(--ink)}.ibtn.del:hover{color:var(--red)}
  .ibtn svg{width:18px;height:18px}

  /* шапка */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 24px;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar .logo{height:40px;width:auto;color:var(--blue)}
  .bar h1{font:800 22px var(--T);letter-spacing:-.03em;margin-left:6px}
  .bar .sp{flex:1}
  .state{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px}
  .state i{width:9px;height:9px;border-radius:50%;background:var(--green)}
  .state.dirty i{background:#ff9500}
  .demo{background:#fff4e5;color:#a35200;font-size:14px;padding:10px 24px;border-bottom:1px solid #ffe2bd}

  .wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 69px)}
  /* список экранов */
  aside{background:var(--tile);padding:18px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line)}
  .side-h{display:flex;align-items:center;justify-content:space-between;font:700 13px var(--T);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:4px 6px}
  .sc{background:#fff;border-radius:18px;padding:12px 12px 12px 14px;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);border:2px solid transparent;transition:border-color .15s}
  .sc.sel{border-color:var(--blue)}
  .sc.off{opacity:.5}
  .sc .n{width:30px;height:30px;border-radius:9px;background:var(--tile);display:grid;place-items:center;font:700 14px var(--T)}
  .sc.sel .n{background:var(--blue);color:#fff}
  .sc .d{min-width:0}
  .sc .d b{display:block;font:600 14px var(--T);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc .d span{display:flex;gap:4px;margin-top:5px}
  .sc .d span i{width:18px;height:18px;border-radius:6px;display:grid;place-items:center}
  .sc .d span i svg{width:11px;height:11px}
  .sc .acts{display:flex;align-items:center}
  .sw2{position:relative;width:42px;height:26px;border-radius:99px;background:var(--tile2);transition:background .2s;flex:none}
  .sw2::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
  .sw2.on{background:var(--green)}.sw2.on::after{transform:translateX(16px)}
  .add{border:2px dashed #d1d1d6;border-radius:18px;padding:14px;font-weight:600;color:var(--blue);font-family:var(--T)}
  .add:hover{background:#fff}
  .settings{margin-top:auto;background:#fff;border-radius:18px;padding:14px}
  .settings label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
  .settings input{width:70px;height:36px;border-radius:10px;border:0;background:var(--tile);text-align:center;font-weight:700}

  main{padding:22px 26px 60px;min-width:0}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .row h2{font:800 26px var(--T);letter-spacing:-.03em;margin-right:auto}
  .seg{display:inline-flex;background:var(--tile);border-radius:12px;padding:3px}
  .seg button{height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:7px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .seg svg{width:22px;height:14px}

  /* предпросмотр */
  .pv{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(40,60,140,.12)}
  .pv .stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff}
  .pv .ph{position:absolute;left:72px;right:72px;top:48px;height:104px;display:flex;align-items:center;justify-content:space-between;z-index:3}
  .pv .ph .logo{height:88px;color:#007aff}
  .pv .ph .pl{display:flex;gap:16px}.pv .ph .pl i{display:block;height:104px;border-radius:26px;background:rgba(255,255,255,.66);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 10px 30px rgba(40,60,140,.07)}
  .replay{position:absolute;right:14px;bottom:14px;z-index:5;background:rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .pv .static .f,.pv .static .ic,.pv .static .sw,.pv .static .insta{transition:none!important;animation:none!important}

  /* редакторы фактов */
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
  .fe{background:var(--tile);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .fe-h{display:flex;align-items:center;gap:10px;font:700 15px var(--T)}
  .fe-h .b{width:26px;height:26px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:13px}
  .fe-h .sp{flex:1}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld>span{font-size:12.5px;font-weight:600;color:var(--mute)}
  .fld input[type=text],.fld textarea,.fld select{width:100%;border:0;background:#fff;border-radius:12px;padding:10px 12px;min-height:40px;outline:none;transition:box-shadow .15s}
  .fld textarea{resize:vertical;min-height:62px;line-height:1.4}
  .fld input:focus,.fld textarea:focus,.fld select:focus{box-shadow:0 0 0 3px rgba(0,122,255,.3)}
  .two{display:grid;grid-template-columns:1fr 90px;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;cursor:pointer;user-select:none}
  .chk input{width:18px;height:18px;accent-color:var(--blue)}
  .chks{display:flex;gap:16px;flex-wrap:wrap}
  .seg.full{display:flex}.seg.full button{flex:1;justify-content:center;padding:0 6px}
  .look{display:flex;gap:8px;align-items:center}
  .icbtn{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
  .icbtn svg{width:24px;height:24px}
  .icbtn.none{background:#fff;color:var(--mute);font-size:11px;font-weight:600;box-shadow:inset 0 0 0 2px var(--tile2)}
  .dots{display:flex;flex-wrap:wrap;gap:6px}
  .dots button{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
  .dots button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
  .more{font-size:13px;font-weight:600;color:var(--blue);align-self:flex-start}
  .hide{display:none!important}

  /* выбор значка */
  .pop{position:fixed;z-index:50;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:12px;display:grid;grid-template-columns:repeat(7,40px);gap:6px}
  .pop button{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--tile);color:var(--ink)}
  .pop button:hover{background:var(--blue);color:#fff}
  .pop button svg{width:22px;height:22px}
  .pop button svg *{stroke:currentColor}
  .pop .none{grid-column:span 7;width:auto;font-size:13px;font-weight:600}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;transition:transform .3s;z-index:60}
  .toast.on{transform:translateX(-50%)}

  /* вход */
  .auth{position:fixed;inset:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
  .auth .logo{height:52px;width:auto;color:var(--blue);align-self:flex-start}
  .auth h2{font:800 32px/1.05 var(--T);letter-spacing:-.04em}
  .auth p{color:var(--mute)}
  .auth input{border:0;background:var(--tile);border-radius:14px;height:50px;padding:0 16px;font-size:16px}
  .auth .err{color:var(--red);min-height:1em;font-size:14px}
  .auth .btn{height:52px;justify-content:center;font-size:16px}

  @media (max-width:1100px){.facts{grid-template-columns:1fr}.wrap{grid-template-columns:1fr}aside{border-right:0}.settings{margin-top:6px}}
  @media (max-width:640px){.bar{padding:10px 14px;flex-wrap:wrap}.bar h1{display:none}main{padding:16px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="tv-core.js"></script>
</head>

6.7 77.8 76.6 82.1 73.7 83.1C73.3 83.3 72.2 83.5 71.8 83.5Z"/><use xlink:href="#g0_0" x="104.3" y="73.3"/><use xlink:href="#g0_1" x="113.6" y="73.3"/><use xlink:href="#g0_2" x="121.8" y="73.3"/><use xlink:href="#g0_3" x="130.8" y="73.3"/><use xlink:href="#g0_4" x="141.7" y="73.3"/><use xlink:href="#g0_5" x="153.2" y="73.3"/><use xlink:href="#g0_6" x="104.3" y="88.9"/><use xlink:href="#g0_7" x="115.2" y="88.9"/><use xlink:href="#g0_8" x="126.6" y="88.9"/><use xlink:href="#g0_9" x="136.9" y="88.9"/><use xlink:href="#g0_3" x="148.2" y="88.9"/><use xlink:href="#g0_4" x="159.1" y="88.9"/><use xlink:href="#g0_7" x="170.6" y="88.9"/><use xlink:href="#g0_10" x="181.9" y="88.9"/><use xlink:href="#g0_11" x="192.5" y="88.9"/><use xlink:href="#g0_12" x="202.6" y="88.9"/><use xlink:href="#g0_9" x="212.4" y="88.9"/><use xlink:href="#g0_4" x="223.6" y="88.9"/><use xlink:href="#g0_5" x="235" y="88.9"/><use xlink:href="#g1_0" x="104.3" y="104.5"/><use xlink:href="#g1_1" x="116" y="104.5"/><use xlink:href="#g1_2" x="125.9" y="104.5"/><use xlink:href="#g1_3" x="135.2" y="104.5"/><use xlink:href="#g1_4" x="143.7" y="104.5"/><use xlink:href="#g1_5" x="153.2" y="104.5"/><use xlink:href="#g1_6" x="164.2" y="104.5"/><use xlink:href="#g1_7" x="174.6" y="104.5"/><use xlink:href="#g1_8" x="185.2" y="104.5"/><use xlink:href="#g1_9" x="195.5" y="104.5"/></g><path fill="none" stroke-width="0.5" stroke="currentColor" d="M 99.1 52.3L99.1 111"/></svg>
  <h2>Экран в студии</h2>
  <p>Войдите под той же почтой, что и в учёт студии.</p>
  <input type="email" id="em" placeholder="Почта" autocomplete="username">
  <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password">
  <div class="err" id="aerr"></div>
  <button class="btn pri" type="submit">Войти</button>
</form></div>

<script>
TV.injectCSS();
const $ = id => document.getElementById(id);
const LOGO = document.querySelector('.bar .logo').outerHTML;
let D = TV.normalize(null), sel = 0, dirty = false, db = null, demo = false, staticPv = true;

/* ---------- предпросмотр ---------- */
$('stage').innerHTML = '<div class="bgfx"><i></i><i></i><i></i><i></i></div><div class="ph">' + LOGO + '<div class="pl"><i style="width:390px"></i><i style="width:355px"></i><i style="width:330px"></i></div></div><div id="pvs" style="position:absolute;inset:0;z-index:2"></div>';
function fitPv(){ $('stage').style.transform = 'scale(' + ($('pv').clientWidth / 1920) + ')'; }
new ResizeObserver(fitPv).observe($('pv'));
function preview(animate){
  const s = D.screens[sel]; if (!s) { $('pvs').innerHTML = ''; return; }
  $('pvs').innerHTML = TV.sceneHTML(s);
  const el = $('pvs').firstElementChild;
  if (animate) { el.classList.remove('static'); requestAnimationFrame(() => TV.animateIn(el)); }
  else { el.classList.add('static', 'on'); }
}
$('replay').onclick = () => preview(true);

/* ---------- список экранов ---------- */
const summary = s => s.facts.map(f => f.big || f.title || f.label).filter(Boolean).slice(0,2).join(' · ') || 'Пустой экран';
function renderList(){
  $('cnt').textContent = D.screens.filter(s => s.on).length + ' из ' + D.screens.length;
  $('list').innerHTML = D.screens.map((s,i) => `<div class="sc ${i===sel?'sel':''} ${s.on?'':'off'}" data-i="${i}">
    <span class="n">${i+1}</span>
    <div class="d"><b>${esc(summary(s))}</b><span>${s.facts.map(f => `<i style="background:${f.style==='blue'?'#007aff':f.style==='kaspi'?'#f14635':(f.icon?TV.COLORS[f.color]:'#d1d1d6')}">${TV.icon(f.icon)}</i>`).join('')}</span></div>
    <div class="acts">
      <button class="ibtn" data-up="${i}" title="Выше"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m18 15-6-6-6 6"/></svg></button>
      <button class="ibtn" data-dn="${i}" title="Ниже"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="sw2 ${s.on?'on':''}" data-tg="${i}" title="Показывать"></button>
    </div></div>`).join('');
}
$('list').onclick = e => {
  const up = e.target.closest('[data-up]'), dn = e.target.closest('[data-dn]'), tg = e.target.closest('[data-tg]'), sc = e.target.closest('.sc');
  if (up) { const i = +up.dataset.up; if (i>0) { [D.screens[i-1], D.screens[i]] = [D.screens[i], D.screens[i-1]]; if (sel===i) sel=i-1; else if (sel===i-1) sel=i; change(); } return; }
  if (dn) { const i = +dn.dataset.dn; if (i<D.screens.length-1) { [D.screens[i+1], D.screens[i]] = [D.screens[i], D.screens[i+1]]; if (sel===i) sel=i+1; else if (sel===i+1) sel=i; change(); } return; }
  if (tg) { const i = +tg.dataset.tg; D.screens[i].on = !D.screens[i].on; change(); return; }
  if (sc) { sel = +sc.dataset.i; renderAll(true); }
};
$('add').onclick = () => { D.screens.push({ on:true, layout:'g3', facts:[TV.newFact(), TV.newFact(), TV.newFact()] }); sel = D.screens.length-1; change(true); scrollTo({top:0,behavior:'smooth'}); };
$('dup').onclick = () => { D.screens.splice(sel+1, 0, JSON.parse(JSON.stringify(D.screens[sel]))); sel++; change(true); toast('Экран скопирован'); };
$('del').onclick = () => {
  if (D.screens.length < 2) return toast('Нужен хотя бы один экран');
  const b = $('del'); if (!b.dataset.sure) { b.dataset.sure = 1; b.style.color = 'var(--red)'; toast('Нажмите ещё раз, чтобы удалить'); setTimeout(() => { delete b.dataset.sure; b.style.color=''; }, 3000); return; }
  delete b.dataset.sure; b.style.color = ''; D.screens.splice(sel,1); sel = Math.max(0, sel-1); change(true); toast('Экран удалён');
};
$('layout').onclick = e => { const b = e.target.closest('button'); if (!b) return; D.screens[sel].layout = b.dataset.v; change(); };
$('sec').oninput = () => { D.slideSec = Math.max(5, Math.min(120, +$('sec').value || 20)); markDirty(); };

/* ---------- редактор факта ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VIS = [['', 'Значок'], ['flag-it','Флаг Италии'], ['swatch','Образец цвета'], ['insta','Instagram'], ['tag','Бирка на фоне']];
function factForm(f, k){
  const big = D.screens[sel].layout === 'g12' && k === 0;
  const icbg = f.style==='blue' ? '#007aff' : f.style==='kaspi' ? '#f14635' : TV.COLORS[f.color];
  return `<div class="fe" data-k="${k}">
    <div class="fe-h"><span class="b">${k+1}</span>${big ? 'Большая карточка' : 'Карточка'}<span class="sp"></span>
      <button class="ibtn" data-act="clear" title="Очистить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M19 6l-1 14H6L5 6"/></svg></button></div>
    <div class="seg full" data-f="style">${[['plain','Обычная'],['blue','Синяя'],['kaspi','Kaspi']].map(([v,t]) => `<button data-v="${v}" class="${f.style===v?'on':''}">${t}</button>`).join('')}</div>
    <div class="look">
      ${f.visual ? '' : `<button class="icbtn ${f.icon?'':'none'}" data-act="icon" style="${f.icon?`background:${icbg}`:''}" title="Сменить значок">${f.icon ? TV.icon(f.icon) : 'нет'}</button>`}
      ${f.style==='plain' ? `<div class="dots">${Object.keys(TV.COLORS).map(c => `<button data-color="${c}" class="${f.color===c?'on':''}" style="background:${TV.COLORS[c]}" title="${TV.COLOR_NAMES[c]}"></button>`).join('')}</div>` : ''}
    </div>
    <label class="fld"><span>Картинка сверху</span><select data-f="visual">${VIS.map(([v,t]) => `<option value="${v}" ${f.visual===v?'selected':''}>${t}</option>`).join('')}</select></label>
    ${f.visual==='swatch' ? `<label class="fld"><span>Цвет образца</span><input type="color" data-f="swatch" value="${esc(f.swatch||'#ffffff')}" style="width:100%;height:40px;border:0;border-radius:12px;background:#fff;padding:4px"></label>` : ''}
    <label class="fld"><span>Подпись сверху</span><input type="text" data-f="label" value="${esc(f.label)}" placeholder="например: Вышивка"></label>
    <div class="fld"><span>Крупно — число или слова</span><div class="two"><input type="text" data-f="big" value="${esc(f.big)}" placeholder="1500 или «Всегда в срок»"><input type="text" data-f="unit" value="${esc(f.unit)}" placeholder="км, кг"></div></div>
    <div class="chks">
      <label class="chk ${TV.isNum(f.big)?'':'hide'}"><input type="checkbox" data-f="plus" ${f.plus?'checked':''}>«+» после числа</label>
      <label class="chk"><input type="checkbox" data-f="numColor" ${f.numColor?'checked':''}>Крупное — цветом</label>
    </div>
    <label class="fld"><span>Заголовок</span><input type="text" data-f="title" value="${esc(f.title)}" placeholder="например: стирок выдерживает принт"></label>
    <label class="fld"><span>Пояснение мелко</span><textarea data-f="caption" placeholder="одна короткая фраза">${esc(f.caption)}</textarea></label>
    <button class="more" data-act="more">${f.list ? 'Список' : '+ Список пунктов'}</button>
    <label class="fld ${f.list?'':'hide'}" data-list><span>Список — каждый пункт с новой строки</span><textarea data-f="list" rows="4">${esc(f.list)}</textarea></label>
  </div>`;
}
function renderFacts(){ $('facts').innerHTML = D.screens[sel].facts.map(factForm).join(''); }
const factOf = el => D.screens[sel].facts[+el.closest('.fe').dataset.k];
$('facts').addEventListener('input', e => {
  const t = e.target, k = t.dataset.f; if (!k) return;
  const f = factOf(t);
  f[k] = t.type === 'checkbox' ? t.checked : t.value;
  if (k === 'big') t.closest('.fe').querySelector('[data-f=plus]').closest('.chk').classList.toggle('hide', !TV.isNum(t.value));
  if (k === 'visual') { renderFacts(); }
  markDirty(); preview(false); renderList();
});
$('facts').addEventListener('click', e => {
  const seg = e.target.closest('[data-f=style] button'), col = e.target.closest('[data-color]'), act = e.target.closest('[data-act]');
  if (seg) { factOf(seg).style = seg.dataset.v; change(); return; }
  if (col) { factOf(col).color = col.dataset.color; change(); return; }
  if (!act) return;
  const f = factOf(act), k = +act.closest('.fe').dataset.k;
  if (act.dataset.act === 'more') { const l = act.parentElement.querySelector('[data-list]'); l.classList.toggle('hide'); if (!l.classList.contains('hide')) l.querySelector('textarea').focus(); }
  if (act.dataset.act === 'clear') { D.screens[sel].facts[k] = Object.assign(TV.normalize({screens:[{facts:[{}]}]}).screens[0].facts[0], {label:'', icon:''}); change(); }
  if (act.dataset.act === 'icon') iconPop(act, f);
});
function iconPop(btn, f){
  closePop();
  const p = document.createElement('div'); p.className = 'pop'; p.id = 'pop';
  p.innerHTML = Object.keys(TV.ICONS).map(n => `<button data-ic="${n}" title="${n}">${TV.icon(n)}</button>`).join('') + '<button class="none" data-ic="">Без значка</button>';
  document.body.appendChild(p);
  const r = btn.getBoundingClientRect();
  p.style.left = Math.min(innerWidth - p.offsetWidth - 10, r.left) + 'px';
  p.style.top = (r.bottom + p.offsetHeight + 8 > innerHeight ? r.top - p.offsetHeight - 8 : r.bottom + 8) + 'px';
  p.onclick = e => { const b = e.target.closest('[data-ic]'); if (!b) return; f.icon = b.dataset.ic; closePop(); change(); };
  setTimeout(() => addEventListener('click', closePop, { once: true }), 0);
}
function closePop(){ const p = $('pop'); if (p) p.remove(); }

/* ---------- общее ---------- */
function renderAll(animate){
  sel = Math.min(sel, D.screens.length - 1);
  $('ttl').textContent = 'Экран ' + (sel+1);
  [...$('layout').children].forEach(b => b.classList.toggle('on', b.dataset.v === D.screens[sel].layout));
  $('sec').value = D.slideSec;
  renderList(); renderFacts(); preview(animate);
}
function change(animate){ markDirty(); renderAll(animate); }
function markDirty(){ dirty = true; $('state').className = 'state dirty'; $('state').lastChild.textContent = 'Есть изменения'; $('save').disabled = false; }
function markClean(t){ dirty = false; $('state').className = 'state'; $('state').lastChild.textContent = t || 'Сохранено'; $('save').disabled = true; }
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2200); }
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

$('save').onclick = async () => {
  if (demo) { markClean('Демо: не сохранено в базу'); toast('В демо-режиме база недоступна'); return; }
  $('save').disabled = true;
  try { await db.ref('pub/' + TV.KEY).set(JSON.parse(JSON.stringify({ ...D, upd: Date.now() }))); markClean(); toast('Сохранено — экран обновится через пару секунд'); }
  catch (e) { $('save').disabled = false; toast('Не сохранилось: ' + (e.code || e.message)); }
};

/* ---------- запуск: вход и загрузка из базы CRM ---------- */
renderAll(true);
(function start(){
  const cfg = window.FIREBASE_CONFIG;
  if (typeof firebase === 'undefined' || !cfg) { demo = true; $('demo').classList.remove('hide'); return; }
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  const auth = firebase.auth(); db = firebase.database();
  auth.onAuthStateChanged(async u => {
    if (!u) { $('auth').classList.remove('hide'); return; }
    $('auth').classList.add('hide');
    try { const v = (await db.ref('pub/' + TV.KEY).get()).val(); if (v) { D = TV.normalize(v); sel = 0; renderAll(true); } markClean(v ? 'Сохранено' : 'В базе пусто — показаны факты по умолчанию'); if (!v) $('save').disabled = false; }
    catch (e) { toast('Нет доступа к базе: ' + (e.code || e.message)); }
  });
  $('authf').onsubmit = async e => { e.preventDefault(); $('aerr').textContent = '';
    try { await auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value); } catch (er) { $('aerr').textContent = 'Не удалось войти: проверьте почту и пароль'; } };
})();
</script>
